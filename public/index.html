<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background-color: #0d1117; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 90%; max-width: 850px; text-align: center; }
        video { width: 100%; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); background: #000; }
        #status { margin-top: 12px; color: #58a6ff; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>البث المباشر</h2>
    <video id="video" controls autoplay muted playsinline></video>
    <div id="status">جاري ضبط التخزين المستمر...</div>
</div>

<script>
  var video = document.getElementById('video');
  var statusText = document.getElementById('status');
  var videoSrc = '/hls/stream.m3u8';

  function loadStream() {
    if (Hls.isSupported()) {
      var hls = new Hls({
        maxBufferLength: 120,            // تخزين دقيقتين مقدماً
        maxMaxBufferLength: 300,
        liveSyncDurationCount: 10,       // الحفاظ على مسافة أمان كبيرة مع البث المباشر
        liveMaxLatencyDurationCount: 30, // منع القفز الإجباري لنهاية البث
        liveDurationInfinity: true,      // معاملة البث المباشر كفيديو متصل لمنع التخطي
        highBufferWatchdogPeriod: 3,
        lowLatencyMode: false
      });

      hls.loadSource(videoSrc);
      hls.attachMedia(video);

      // تحديث شريط التخزين المتبقي دون قفز
      hls.on(Hls.Events.FRAG_BUFFERED, function () {
        var buffered = video.buffered;
        if (buffered.length > 0) {
          var bufferedSeconds = buffered.end(0) - video.currentTime;
          if (bufferedSeconds > 0) {
            statusText.innerText = "المخزّن المتبقي أمامك: " + Math.round(bufferedSeconds) + " ثانية (بدون قفز)";
          }
        }
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          setTimeout(loadStream, 2000);
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    }
  }

  loadStream();
</script>

</body>
</html>
